[package]
name = "venom-migrator"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5.3", features = ["derive"] }
serde = "1.0"
serde_json = "1.0.114"
thiserror = "2.0"
tokio = { version = "1", default-features = false }

tikv-jemallocator = { version = "0.6.0", features = [
    "unprefixed_malloc_on_supported_platforms",
    "background_threads",
] }

tycho-block-util = "0.3.6"
tycho-core = "0.3.6"
tycho-storage = "0.3.6"
tycho-util = "0.3.6"

tycho-vm = "0.3.2"

[build-dependencies]
anyhow = "1.0"

